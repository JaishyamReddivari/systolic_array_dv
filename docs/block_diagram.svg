  <text x="760" y="725" class="iface-text">m_axis_c</text>
  <text x="760" y="742" class="iface-text" font-size="10">Results — 256b @ 8 beats</text>

  <line x1="650" y1="720" x2="680" y2="720" class="arrow-c"/>

  <!-- Legend -->
  <rect x="700" y="240" width="270" height="160" rx="4" class="legend-box"/>
  <text x="715" y="260" font-size="12" font-weight="700" fill="#111">Legend</text>

  <line x1="715" y1="280" x2="745" y2="280" class="arrow-a"/>
  <text x="755" y="284" class="small">A (weights) — INT8, loaded once</text>

  <line x1="715" y1="300" x2="745" y2="300" class="arrow-b"/>
  <text x="755" y="304" class="small">B (activations) — INT8, streamed</text>

  <line x1="715" y1="320" x2="745" y2="320" class="arrow-c"/>
  <text x="755" y="324" class="small">C (psums / results) — INT32</text>

  <line x1="715" y1="340" x2="745" y2="340" class="arrow"/>
  <text x="755" y="344" class="small">Control / status signals</text>

  <text x="715" y="370" class="small" font-weight="700">Timing per tile:</text>
  <text x="715" y="385" class="small">LOAD (8) → COMPUTE (8) → DRAIN (8) = 24 cycles</text>

</svg>
