<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">

  <style>
    .title { font-size: 18px; font-weight: 700; fill: #111; }
    .label { font-size: 12px; fill: #333; }
    .small { font-size: 10px; fill: #555; }
    .pe-text { font-size: 9px; fill: #fff; text-anchor: middle; }
    .pe-coord { font-size: 8px; fill: #cbd5e1; text-anchor: middle; }
    .block { fill: #1e293b; stroke: #0f172a; stroke-width: 1; }
    .iface { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .iface-text { font-size: 11px; fill: #78350f; font-weight: 600; text-anchor: middle; }
    .arrow { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrow-b { stroke: #0369a1; stroke-width: 2; fill: none; marker-end: url(#arrow-b); }
    .arrow-c { stroke: #15803d; stroke-width: 2; fill: none; marker-end: url(#arrow-c); }
    .arrow-a { stroke: #b45309; stroke-width: 2; fill: none; marker-end: url(#arrow-a); }
    .ctrl { fill: #ede9fe; stroke: #6d28d9; stroke-width: 1.5; }
    .ctrl-text { font-size: 11px; fill: #5b21b6; font-weight: 600; text-anchor: middle; }
    .legend-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/>
    </marker>
    <marker id="arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="28" text-anchor="middle" class="title">8×8 INT8 Weight-Stationary Systolic Array — Block Diagram</text>
  <text x="500" y="46" text-anchor="middle" class="small">Rev A — `systolic_array_dv`</text>

  <!-- AXI-Lite control interface (top left) -->
  <rect x="40" y="80" width="160" height="60" rx="4" class="iface"/>
  <text x="120" y="105" class="iface-text">s_axi_lite</text>
  <text x="120" y="122" class="iface-text" font-size="10">CTRL / STATUS / IRQ</text>

  <!-- A input interface (top) -->
  <rect x="240" y="80" width="160" height="60" rx="4" class="iface"/>
  <text x="320" y="105" class="iface-text">s_axis_a</text>
  <text x="320" y="122" class="iface-text" font-size="10">Weights — 64b @ 8 beats</text>

  <!-- B input interface (top) -->
  <rect x="440" y="80" width="160" height="60" rx="4" class="iface"/>
  <text x="520" y="105" class="iface-text">s_axis_b</text>
  <text x="520" y="122" class="iface-text" font-size="10">Activations — 64b @ 8 beats</text>

  <!-- Controller FSM (right) -->
  <rect x="780" y="80" width="180" height="120" rx="4" class="ctrl"/>
  <text x="870" y="105" class="ctrl-text">Controller FSM</text>
  <text x="870" y="125" class="small" text-anchor="middle">IDLE → LOAD → COMPUTE</text>
  <text x="870" y="140" class="small" text-anchor="middle">    → DRAIN → IDLE</text>
  <text x="870" y="160" class="small" text-anchor="middle">• Skew sequencer for B</text>
  <text x="870" y="174" class="small" text-anchor="middle">• Weight-load shift control</text>
  <text x="870" y="188" class="small" text-anchor="middle">• tile_cnt, busy, done</text>

  <!-- Connection: AXI-Lite to FSM -->
  <line x1="200" y1="110" x2="780" y2="120" class="arrow"/>

  <!-- A-buffer (weight buffer) -->
  <rect x="240" y="170" width="160" height="40" rx="3" class="block"/>
  <text x="320" y="195" text-anchor="middle" font-size="11" fill="#fff">Weight Load Buffer</text>

  <!-- B-buffer (activation buffer + skew) -->
  <rect x="440" y="170" width="160" height="40" rx="3" class="block"/>
  <text x="520" y="190" text-anchor="middle" font-size="11" fill="#fff">Activation Buffer</text>
  <text x="520" y="203" text-anchor="middle" font-size="9" fill="#cbd5e1">+ skew staircase</text>

  <!-- AXI to buffer arrows -->
  <line x1="320" y1="140" x2="320" y2="170" class="arrow-a"/>
  <line x1="520" y1="140" x2="520" y2="170" class="arrow-b"/>

  <!-- A buffer drives top edge of PE grid (load phase) -->
  <line x1="320" y1="210" x2="320" y2="245" class="arrow-a"/>
  <!-- B buffer drives top edge of PE grid (compute phase) -->
  <line x1="520" y1="210" x2="520" y2="245" class="arrow-b"/>

  <!-- Note about A-load shift direction -->
  <text x="200" y="232" class="small" text-anchor="end" fill="#b45309">A loaded top→bottom</text>
  <text x="200" y="244" class="small" text-anchor="end" fill="#b45309">during LOAD phase</text>

  <text x="640" y="232" class="small" fill="#0369a1">B streams top→bottom</text>
  <text x="640" y="244" class="small" fill="#0369a1">with skew during COMPUTE</text>

  <!-- 8x8 PE Grid -->
  <g id="pe-grid">
    <!-- 8 rows x 8 cols, each PE 50x50, starting at (180, 250) -->
  </g>

  <!-- Build PE grid -->
  <g>
    <!-- Row 0 -->
    <g>
      <rect x="180" y="250" width="50" height="50" rx="3" class="block"/>
      <text x="205" y="272" class="pe-text">PE</text>
      <text x="205" y="290" class="pe-coord">(0,0)</text>
      <rect x="240" y="250" width="50" height="50" rx="3" class="block"/>
      <text x="265" y="272" class="pe-text">PE</text>
      <text x="265" y="290" class="pe-coord">(0,1)</text>
      <rect x="300" y="250" width="50" height="50" rx="3" class="block"/>
      <text x="325" y="272" class="pe-text">PE</text>
      <text x="325" y="290" class="pe-coord">(0,2)</text>
      <rect x="360" y="250" width="50" height="50" rx="3" class="block"/>
      <text x="385" y="272" class="pe-text">PE</text>
      <text x="385" y="290" class="pe-coord">(0,3)</text>
      <rect x="420" y="250" width="50" height="50" rx="3" class="block"/>
      <text x="445" y="272" class="pe-text">PE</text>
      <text x="445" y="290" class="pe-coord">(0,4)</text>
      <rect x="480" y="250" width="50" height="50" rx="3" class="block"/>
      <text x="505" y="272" class="pe-text">PE</text>
      <text x="505" y="290" class="pe-coord">(0,5)</text>
      <rect x="540" y="250" width="50" height="50" rx="3" class="block"/>
      <text x="565" y="272" class="pe-text">PE</text>
      <text x="565" y="290" class="pe-coord">(0,6)</text>
      <rect x="600" y="250" width="50" height="50" rx="3" class="block"/>
      <text x="625" y="272" class="pe-text">PE</text>
      <text x="625" y="290" class="pe-coord">(0,7)</text>
    </g>
    <!-- Row 1 -->
    <g>
      <rect x="180" y="305" width="50" height="50" rx="3" class="block"/>
      <text x="205" y="327" class="pe-text">PE</text>
      <text x="205" y="345" class="pe-coord">(1,0)</text>
      <rect x="240" y="305" width="50" height="50" rx="3" class="block"/>
      <text x="265" y="327" class="pe-text">PE</text>
      <text x="265" y="345" class="pe-coord">(1,1)</text>
      <rect x="300" y="305" width="50" height="50" rx="3" class="block"/>
      <text x="325" y="327" class="pe-text">PE</text>
      <text x="325" y="345" class="pe-coord">(1,2)</text>
      <rect x="360" y="305" width="50" height="50" rx="3" class="block"/>
      <text x="385" y="327" class="pe-text">PE</text>
      <text x="385" y="345" class="pe-coord">(1,3)</text>
      <rect x="420" y="305" width="50" height="50" rx="3" class="block"/>
      <text x="445" y="327" class="pe-text">PE</text>
