      <rect x="540" y="525" width="50" height="50" rx="3" class="block"/>
      <text x="565" y="547" class="pe-text">PE</text>
      <text x="565" y="565" class="pe-coord">(5,6)</text>
      <rect x="600" y="525" width="50" height="50" rx="3" class="block"/>
      <text x="625" y="547" class="pe-text">PE</text>
      <text x="625" y="565" class="pe-coord">(5,7)</text>
