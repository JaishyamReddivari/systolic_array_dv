      <rect x="420" y="470" width="50" height="50" rx="3" class="block"/>
      <text x="445" y="492" class="pe-text">PE</text>
      <text x="445" y="510" class="pe-coord">(4,4)</text>
      <rect x="480" y="470" width="50" height="50" rx="3" class="block"/>
      <text x="505" y="492" class="pe-text">PE</text>
      <text x="505" y="510" class="pe-coord">(4,5)</text>
      <rect x="540" y="470" width="50" height="50" rx="3" class="block"/>
      <text x="565" y="492" class="pe-text">PE</text>
      <text x="565" y="510" class="pe-coord">(4,6)</text>
      <rect x="600" y="470" width="50" height="50" rx="3" class="block"/>
      <text x="625" y="492" class="pe-text">PE</text>
      <text x="625" y="510" class="pe-coord">(4,7)</text>
    </g>
    <!-- Row 5 -->
    <g>
      <rect x="180" y="525" width="50" height="50" rx="3" class="block"/>
      <text x="205" y="547" class="pe-text">PE</text>
      <text x="205" y="565" class="pe-coord">(5,0)</text>
      <rect x="240" y="525" width="50" height="50" rx="3" class="block"/>
      <text x="265" y="547" class="pe-text">PE</text>
      <text x="265" y="565" class="pe-coord">(5,1)</text>
      <rect x="300" y="525" width="50" height="50" rx="3" class="block"/>
      <text x="325" y="547" class="pe-text">PE</text>
      <text x="325" y="565" class="pe-coord">(5,2)</text>
      <rect x="360" y="525" width="50" height="50" rx="3" class="block"/>
      <text x="385" y="547" class="pe-text">PE</text>
      <text x="385" y="565" class="pe-coord">(5,3)</text>
      <rect x="420" y="525" width="50" height="50" rx="3" class="block"/>
      <text x="445" y="547" class="pe-text">PE</text>
