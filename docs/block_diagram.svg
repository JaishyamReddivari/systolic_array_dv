  <text x="520" y="28" text-anchor="middle" class="title">8x8 INT8 Weight-Stationary Systolic Array — Block Diagram</text>
  <text x="520" y="46" text-anchor="middle" class="small">Rev A — systolic_array_dv   |   B flows down, partial sums flow right, C exits right edge</text>

  <!-- Top interfaces -->
  <rect x="40" y="80" width="150" height="56" rx="4" class="iface"/>
  <text x="115" y="104" class="iface-text">s_axi_lite</text>
  <text x="115" y="120" class="iface-text" font-size="10">CTRL / STATUS / IRQ</text>

  <rect x="240" y="80" width="150" height="56" rx="4" class="iface"/>
  <text x="315" y="104" class="iface-text">s_axis_a</text>
  <text x="315" y="120" class="iface-text" font-size="10">Weights (preloaded)</text>

  <rect x="430" y="80" width="170" height="56" rx="4" class="iface"/>
  <text x="515" y="104" class="iface-text">s_axis_b</text>
  <text x="515" y="120" class="iface-text" font-size="10">Activations — 64b x 8 beats</text>

  <!-- Controller -->
  <rect x="820" y="80" width="180" height="120" rx="4" class="ctrl"/>
  <text x="910" y="104" class="ctrl-text">Controller FSM</text>
  <text x="910" y="124" class="small" text-anchor="middle">IDLE -&gt; LOAD -&gt; COMPUTE</text>
  <text x="910" y="138" class="small" text-anchor="middle">    -&gt; DRAIN -&gt; IDLE</text>
  <text x="910" y="158" class="small" text-anchor="middle">• B input skew sequencer</text>
  <text x="910" y="172" class="small" text-anchor="middle">• C output de-skew</text>
  <text x="910" y="186" class="small" text-anchor="middle">• tile_cnt, busy, done</text>

  <line x1="190" y1="108" x2="820" y2="120" class="arrow"/>

  <!-- Weight load + activation buffer -->
  <rect x="240" y="166" width="150" height="38" rx="3" class="block"/>
  <text x="315" y="189" text-anchor="middle" font-size="11" fill="#fff">Weight Load Path</text>

  <rect x="430" y="166" width="170" height="38" rx="3" class="block"/>
  <text x="515" y="183" text-anchor="middle" font-size="11" fill="#fff">Activation Buffer</text>
  <text x="515" y="196" text-anchor="middle" font-size="9" fill="#cbd5e1">+ skew staircase</text>

  <line x1="315" y1="136" x2="315" y2="166" class="arrow-a"/>
  <line x1="515" y1="136" x2="515" y2="166" class="arrow-b"/>

