<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">

  <style>
    .title { font-size: 18px; font-weight: 700; fill: #111; }
    .small { font-size: 10px; fill: #555; }
    .pe-text { font-size: 9px; fill: #fff; text-anchor: middle; }
    .pe-coord { font-size: 8px; fill: #cbd5e1; text-anchor: middle; }
    .block { fill: #1e293b; stroke: #0f172a; stroke-width: 1; }
    .iface { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .iface-text { font-size: 11px; fill: #78350f; font-weight: 600; text-anchor: middle; }
    .ctrl { fill: #ede9fe; stroke: #6d28d9; stroke-width: 1.5; }
    .ctrl-text { font-size: 11px; fill: #5b21b6; font-weight: 600; text-anchor: middle; }
    .legend-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .arrow   { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrow-b { stroke: #0369a1; stroke-width: 2;   fill: none; marker-end: url(#arrow-b); }
    .arrow-c { stroke: #15803d; stroke-width: 2;   fill: none; marker-end: url(#arrow-c); }
    .arrow-a { stroke: #b45309; stroke-width: 2;   fill: none; marker-end: url(#arrow-a); }
  </style>

  <defs>
    <marker id="arrow"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
