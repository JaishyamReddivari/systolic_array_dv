      <text x="505" y="382" class="pe-text">PE</text>
      <text x="505" y="400" class="pe-coord">(2,5)</text>
      <rect x="540" y="360" width="50" height="50" rx="3" class="block"/>
      <text x="565" y="382" class="pe-text">PE</text>
      <text x="565" y="400" class="pe-coord">(2,6)</text>
      <rect x="600" y="360" width="50" height="50" rx="3" class="block"/>
      <text x="625" y="382" class="pe-text">PE</text>
      <text x="625" y="400" class="pe-coord">(2,7)</text>
    </g>
    <!-- Row 3 -->
