      <text x="205" y="382" class="pe-text">PE</text>
      <text x="205" y="400" class="pe-coord">(2,0)</text>
      <rect x="240" y="360" width="50" height="50" rx="3" class="block"/>
      <text x="265" y="382" class="pe-text">PE</text>
      <text x="265" y="400" class="pe-coord">(2,1)</text>
      <rect x="300" y="360" width="50" height="50" rx="3" class="block"/>
      <text x="325" y="382" class="pe-text">PE</text>
      <text x="325" y="400" class="pe-coord">(2,2)</text>
      <rect x="360" y="360" width="50" height="50" rx="3" class="block"/>
