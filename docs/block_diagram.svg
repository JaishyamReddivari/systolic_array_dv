  <!-- Decorative downward arrows showing data flow (between rows) -->
  <line x1="265" y1="300" x2="265" y2="305" class="arrow-b" stroke-opacity="0.3"/>
  <line x1="385" y1="355" x2="385" y2="360" class="arrow-b" stroke-opacity="0.3"/>
  <line x1="505" y1="410" x2="505" y2="415" class="arrow-b" stroke-opacity="0.3"/>

  <!-- Output Drain row (bottom edge) -->
  <rect x="180" y="700" width="470" height="40" rx="3" class="block"/>
  <text x="415" y="725" text-anchor="middle" font-size="11" fill="#fff">Output Drain / Result Pack (8 × INT32)</text>

  <!-- Arrows from bottom of grid to drain -->
  <line x1="205" y1="685" x2="205" y2="700" class="arrow-c"/>
  <line x1="325" y1="685" x2="325" y2="700" class="arrow-c"/>
  <line x1="445" y1="685" x2="445" y2="700" class="arrow-c"/>
  <line x1="565" y1="685" x2="565" y2="700" class="arrow-c"/>

